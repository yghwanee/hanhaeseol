name: News Digest

# 감시 키워드 뉴스를 모아 docs/news-digest.md 를 갱신한다.
# 주간 글감 루틴(claude.ai, 월 06:30 KST)이 이 파일을 근거로 글감을 만든다.
# 루틴보다 먼저 돌아야 하므로 월요일 06:00 KST.
#
# 매일도 돌린다 — 뉴스는 매일 쌓이고, 나중에 뉴스잭(터진 날 즉시 발행)을 붙일 때도 이 파일을 쓴다.
on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST (월요일 글감 루틴 06:30 직전)
  workflow_dispatch: {}

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: 뉴스 수집
        env:
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
        run: npm run news:digest

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/news-digest.md; then
            echo "변경 없음"
            exit 0
          fi
          git add docs/news-digest.md
          git commit -m "chore: refresh news digest"
          # 매시 크롤과 부딪히면 리베이스 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1

      # 다이제스트가 조용히 멈추면 월요일 글감이 근거 없이 나온다. 실패는 알려야 한다.
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG=$(printf '%s\n' \
            "⚠️ 뉴스 다이제스트 갱신 실패" \
            "" \
            "네이버 API 키·한도를 확인하세요. 기존 다이제스트는 그대로 남아 있습니다." \
            "${RUN_URL}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
