name: Auto-publish Draft

# 한해설 Topic 자동 초안(draft/* 브랜치 PR)을 사람 검수 없이 자동 발행한다.
# 흐름: 빌드 통과 → ready 전환 → squash 머지 → main 푸시 → Vercel 자동 배포 → 큐 [x] 처리.
#
# ⚠️ 트리거 주의: 루틴(자동화)이 연 PR의 `opened` 이벤트는 다른 워크플로를 트리거하지
# 못한다(GitHub 사양 — 무한루프 방지). 그래서 `opened`에만 의존하면 무인 발행이 안 된다.
# → `schedule`로 주기 폴링하며 "열린 draft/* PR 전부"를 처리하는 방식으로 한다.
# pull_request 트리거는 사람이 손댄 경우(ready_for_review/push) 빠른 처리용 보조로만 둔다.
on:
  schedule:
    - cron: '40 21 * * 1-4'   # 화~금 06:40 KST — 아침 초안 루틴(06:30) 직후 폴링
    - cron: '10 22 * * 1-4'   # 화~금 07:10 KST — 1차가 놓쳤을 때 백업 폴링
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-publish-draft
  cancel-in-progress: false

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Publish open draft PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail

          tg() {  # 텔레그램 알림 (토큰 없으면 조용히 스킵)
            [ -n "${TELEGRAM_BOT_TOKEN:-}" ] || return 0
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text=$1" >/dev/null || true
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 열린 draft/* PR 목록(없으면 종료). base64로 줄단위 안전 처리.
          rows=$(gh pr list --state open --json number,headRefName,title,url \
                   --jq '.[] | select(.headRefName | startswith("draft/")) | @base64')
          if [ -z "$rows" ]; then
            echo "열린 draft/* PR 없음 — 할 일 없음"
            exit 0
          fi

          for row in $rows; do
            field() { echo "$row" | base64 -d | jq -r "$1"; }
            num=$(field '.number')
            head=$(field '.headRefName')
            title=$(field '.title')
            url=$(field '.url')
            echo "::group::PR #$num ($head)"

            # 빌드 게이트: PR head 내용으로 빌드. 깨지면 머지하지 않고 알림.
            git fetch origin "$head" || { echo "fetch 실패"; echo "::endgroup::"; continue; }
            git checkout -f FETCH_HEAD
            if ! npm run build; then
              git checkout -f main
              tg "$(printf '%s\n' '⚠️ 토픽 글 자동 발행 실패 (빌드 오류 등)' '' "$title" '' "머지 안 됨 — 확인 필요: $url")"
              echo "빌드 실패 → 스킵"
              echo "::endgroup::"
              continue
            fi
            git checkout -f main

            # 루틴은 PR을 GitHub Draft로 연다 → ready 전환 후 머지.
            gh pr ready "$num" || true
            if ! gh pr merge "$num" --squash --delete-branch; then
              tg "$(printf '%s\n' '⚠️ 토픽 글 머지 실패' '' "$title" '' "확인 필요: $url")"
              echo "머지 실패 → 스킵"
              echo "::endgroup::"
              continue
            fi

            # 중복 방지: 발행된 slug의 큐 줄을 [x]로. slug = draft/YYYY-MM-DD-<slug>.
            slug=$(echo "$head" | sed -E 's#^draft/[0-9]{4}-[0-9]{2}-[0-9]{2}-##')
            git fetch origin main
            git checkout -B main origin/main
            if grep -q "(slug: ${slug})" docs/content-plan.md; then
              sed -i "/(slug: ${slug})/ s/^- \[ \]/- [x]/" docs/content-plan.md
              if ! git diff --quiet docs/content-plan.md; then
                git add docs/content-plan.md
                git commit -m "chore(content-plan): ${slug} 발행 처리 [vercel skip]"
                git push origin HEAD:main || tg "⚠️ 큐 [x] 처리 푸시 실패: ${slug}"
              fi
            fi

            tg "$(printf '%s\n' '✅ 토픽 글 자동 발행 완료' '' "$title" '' 'https://haeseol.com/guide')"
            echo "발행 완료: $slug"
            echo "::endgroup::"
          done
