name: Auto-publish Draft

# 한해설 Topic 자동 초안(draft/* 브랜치 PR)을 사람 검수 없이 자동 발행한다.
# 흐름: 빌드 통과 → 머지 → main 푸시 → Vercel 자동 배포.
# 빌드가 깨지면(잘못된 마크다운 등) 머지하지 않고, 배포가 얼어붙지 않게 막은 뒤
# 텔레그램으로 알려 사람이 확인하게 한다. (notify-draft-pr.yml 의 검수 알림을 대체)
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-publish:
    # 자동 초안은 draft/ 브랜치로만 올라오므로 그 PR만 다룬다.
    if: startsWith(github.head_ref, 'draft/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      # 빌드 게이트: 잘못된 초안이 main 에 들어가 전체 배포(시간별 크롤 커밋 포함)를
      # 얼리는 걸 막는 안전망. 가이드는 정적 생성이라 마크다운이 깨지면 여기서 실패한다.
      - run: npm run build

      - name: Merge & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch

      - name: Notify success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          MSG=$(printf '%s\n' \
            "✅ 토픽 글 자동 발행 완료" \
            "" \
            "${PR_TITLE}" \
            "" \
            "https://haeseol.com/guide")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          MSG=$(printf '%s\n' \
            "⚠️ 토픽 글 자동 발행 실패 (빌드 오류 등)" \
            "" \
            "${PR_TITLE}" \
            "" \
            "머지 안 됨 — 확인 필요: ${PR_URL}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
