name: Generate insta & youtube

on:
  schedule:
    # cron은 UTC 10:18 (= KST 19:18). GH Actions 지연 1~2h 고려하면 실제 시작은 KST 20~21시.
    # 목표 노출 시각은 KST 저녁 골든타임(20:18 근처).
    - cron: '18 10 * * *'
  workflow_dispatch:
    inputs:
      skip_instagram:
        description: '인스타 게시 SKIP (only Youtube)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  instagram:
    runs-on: ubuntu-latest
    # 4/20: 인스타 액션블록 쿨다운으로 1회 스킵.
    # 5/24: 컨테이너 노드 GET 거부 이슈 fix 검증용 수동 run을 이미 KST 16시에 실행 → 중복 방지.
    # 수동 실행은 계속 가능.
    if: ${{ github.event_name != 'schedule' || (!startsWith(github.run_started_at, '2026-04-20') && !startsWith(github.run_started_at, '2026-05-24')) }}
    env:
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
      GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: ffmpeg 확인 (사전 설치돼 있으면 skip)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 토큰 헬스체크
        run: npm run ig:check && npm run tiktok:check

      - name: 카드 생성
        run: npm run post:all -- --no-send

      - name: 릴스 영상 생성
        run: npm run reel:make

      - name: 스토리 이미지 생성
        run: npm run story:make

      - name: 이미지/영상을 insta-media 브랜치에 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd generated/instagram
          git init -q
          git checkout -q -b insta-media
          git add -A
          # commit message 에 [vercel skip] 토큰을 박아 Vercel 이 이 브랜치
          # push 의 빌드를 자동 스킵하게 함. insta-media 는 미디어 전용 orphan
          # 브랜치라 Next.js 코드(app/, package.json) 가 없어 빌드 시도 시
          # "Couldn't find any pages or app directory" 로 100% 실패함.
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              commit -q -m "update $(date -u +%F) [vercel skip]"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:insta-media
          echo "✅ insta-media 브랜치 업데이트 완료"

      - name: raw.githubusercontent CDN 반영 대기
        run: sleep 10

      - name: 캐러셀 게시
        if: ${{ inputs.skip_instagram != true }}
        run: npm run post:ig

      - name: 릴스 게시
        if: ${{ always() && inputs.skip_instagram != true }}
        run: npm run post:reel

      - name: 스토리 게시
        if: ${{ always() && inputs.skip_instagram != true }}
        run: npm run post:story

      - name: 유튜브 쇼츠 업로드
        if: always()
        run: npm run post:youtube

      # TikTok audit 통과 후 아래 3줄 + 성공 메시지의 "틱톡(쇼츠)" 복구
      # - name: 틱톡 업로드
      #   if: always()
      #   run: npm run post:tiktok

      - name: Telegram 성공 알림
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ 인스타(피드+릴스+스토리), 유튜브(쇼츠) 업로드 완료"

      - name: Telegram 실패 알림 + 카드 전송
        if: failure()
        run: npm run telegram:failure
