name: Evening post (tomorrow schedule, v2)

on:
  schedule:
    # cron UTC 7:18 = KST 16:18.
    #
    # 🔴 이 값은 **cron 시각이 아니라 실제 게시 시각을 목표로** 정한다. GH Actions 무료 티어
    # cron 은 정시 보장이 없고, 이 워크플로는 실측 지연이 **최소 1.4h / 중위 2.0h / 최대 3.3h**
    # 였다(2026-07-29, 최근 8회). 그래서 KST 16:18 로 두면 실제 게시가
    # **17:43 ~ 19:35, 중위 18:18** 이 된다.
    #
    # 목표 창을 KST 18~19시로 잡은 근거는 운영자 관측(그 시간대 조회수가 높음)이다.
    # 전에는 cron KST 18:18 이라 실제 게시가 19:42~21:35(중위 20:26)로 목표보다 늦었다.
    # 주석에 "지연 ~3h → KST 21시대"라고 적혀 있었는데 실측 중위는 2.0h 로 과대 추정이었다.
    #
    # 한 시간 늦추고 싶으면 `18 8`(KST 17:18 → 중위 19:18)로 바꾸면 된다.
    # 정각(:00)은 쓰지 않는다 — GH Actions 큐가 정각에 몰려 지연이 커진다(작업21).
    #
    # 내일 경기 정보를 저녁 시청자에게 푸시한다(오전 워크플로우는 당일 경기 정보).
    # 편성 데이터는 KST 08:18 + 백업 10:48·13:48 에 갱신되므로 이 시각엔 이미 최신이다.
    - cron: '18 7 * * *'
  workflow_dispatch:
    inputs:
      # 종전의 skip_instagram / instagram_only 를 대체한다(같은 걸 세 가지 방법으로
      # 표현하던 것을 하나로). 인스타만 = carousel,reel,story / 유튜브·틱톡만 = youtube,tiktok
      only:
        description: '이 채널만 게시 (쉼표 구분: carousel,reel,story,youtube,tiktok). 비우면 전부'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  instagram:
    runs-on: ubuntu-latest
    env:
      # 내일 경기 (=offset 1). 오전 워크플로우는 0 (=당일).
      KST_OFFSET_DAYS: '1'
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
      GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      HHS_REPORT_TITLE: '🌙 [저녁] 내일 경기'
      HHS_WORKFLOW: instagram.yml
    steps:
      - uses: actions/checkout@v6

      # 이번 실행에서 게시할 채널을 한 곳에서 정한다.
      # 부분 실패(예: 릴스만 ERROR) 시 워크플로를 통째 재실행하면 성공했던 채널이
      # 중복 게시되므로, 실패 알림이 알려주는 `-f only=reel` 로 그것만 다시 돌린다.
      - name: 게시 대상 채널 결정
        id: plan
        run: |
          ALL="carousel reel story youtube tiktok"
          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            PICKED=""
            for c in $(echo "$ONLY" | tr ',' ' '); do
              case " $ALL " in
                *" $c "*) PICKED="$PICKED $c" ;;
                *) echo "::error::알 수 없는 채널: $c (가능: $ALL)"; exit 1 ;;
              esac
            done
          else
            PICKED="$ALL"
          fi
          # only="," 처럼 유효 채널이 하나도 안 남으면, 아무것도 안 올리고 "성공"으로 끝난다.
          if [ -z "$PICKED" ]; then echo "::error::only 에서 유효한 채널을 못 찾음: '$ONLY'"; exit 1; fi
          LIST=",$(echo $PICKED | tr ' ' ','),"
          echo "channels=$LIST" >> "$GITHUB_OUTPUT"
          echo "HHS_CHANNELS=$LIST" >> "$GITHUB_ENV"
          echo "📋 게시 대상: $LIST"

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: ffmpeg 확인 (사전 설치돼 있으면 skip)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 토큰 헬스체크
        run: npm run ig:check && npm run tiktok:check

      # 이 실행이 어느 날짜를 대상으로 하는지 남긴다. 2026-08-27 사고 때
      # 로그에 대상 날짜가 없어 생성 파일명으로 역추적해야 했다.
      # 🔴 같은 대상 날짜를 두 번 올리는 것을 막는다 (2026-08-29).
      # cron 이 12시간 밀려 저녁분이 자정을 넘겨 돌면, 사이클 보정 덕에 날짜는
      # 맞지만 그 몇 시간 뒤 아침분이 **같은 날짜**를 또 올린다.
      # 워크플로 이름이 아니라 대상 날짜로 비교하므로 정상 운영은 안 막는다.
      # 조회 실패 시엔 게시를 진행한다(fail-open).
      - name: 사이클 창·중복 검사
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run post:cyclecheck

      - name: 게시 건너뜀 (Telegram 알림)
        if: ${{ steps.dup.outputs.skip == 'true' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="⏭️ ${{ env.HHS_REPORT_TITLE }} 건너뜀%0A대상: ${{ steps.dup.outputs.target }}%0A사유: ${{ steps.dup.outputs.reason }}"
          RES=$(curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"             -d chat_id="${TG_CHAT}" -d text="$TEXT") || true
          echo "$RES" | grep -q '"ok":true' || echo "::warning::텔레그램 알림 실패"

      - name: 대상 날짜 확인 (사이클 보정 포함)
        run: npm run post:target

      - name: 카드 생성
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: npm run post:all -- --no-send

      - name: 릴스 영상 생성 (신규 v2 — punch + xfade zoomin)
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: npm run reel:make:v2

      - name: 스토리 이미지 생성
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: npm run story:make

      # 🔴 push 앞에 있어야 한다. 인스타에 올리는 이미지는 JPEG 로 굽는다 — Meta 공식
      # 이미지 포맷은 JPEG 뿐이고 PNG 는 그쪽 변환기를 태우는 비공식 경로다.
      # 2026-08-15 아침 캐러셀 8장이 그 변환에서 통째로 죽었다(36001/2207084).
      - name: 인스타 업로드용 JPEG 변환
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: npm run ig:jpeg

      - name: 이미지/영상을 insta-media 브랜치에 푸시
        if: ${{ steps.dup.outputs.skip != 'true' }}
        id: media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd generated/instagram
          git init -q
          git checkout -q -b insta-media
          git add -A
          # (참고) 이 토큰 자체는 배포를 못 막는다 — 실제로 막는 건 vercel.json 의
          # git.deploymentEnabled=false 다. 아래는 옛 의도 기록.
          # commit message 에 [vercel skip] 토큰을 박아 Vercel 이 이 브랜치
          # push 의 빌드를 자동 스킵하게 함. insta-media 는 미디어 전용 orphan
          # 브랜치라 Next.js 코드(app/, package.json) 가 없어 빌드 시도 시
          # "Couldn't find any pages or app directory" 로 100% 실패함.
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              commit -q -m "update $(date -u +%F) [vercel skip]"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:insta-media
          echo "✅ insta-media 브랜치 업데이트 완료"

      - name: raw.githubusercontent CDN 반영 대기
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: sleep 30

      # 아래 게시 스텝은 서로 독립이다 — 하나가 실패해도 나머지는 시도한다.
      # 그래야 "5개 중 1개만 실패" 상태로 끝나고, 그 1개만 재실행할 수 있다.
      #
      # 🔴 다만 조건이 `always()` 이면 **미디어 준비가 실패했을 때도 게시가 돌았다.**
      # 카드/릴스/스토리 생성이나 insta-media push 가 깨지면 그 브랜치엔 **어제 미디어**가
      # 그대로 남아 있고, 게시 스크립트는 raw CDN URL 을 보므로 어제 것을 오늘 다시 올린다.
      # 그래서 미디어 스텝 성공을 전제로 건다(취소는 그대로 존중 = `!cancelled()`).
      - name: 캐러셀 게시
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',carousel,') }}
        run: npm run post:ig

      - name: 릴스 게시
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',reel,') }}
        run: npm run post:reel

      - name: 스토리 게시
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',story,') }}
        run: npm run post:story

      - name: 유튜브 쇼츠 업로드
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',youtube,') }}
        run: npm run post:youtube

      # 틱톡 전용 릴스(URL 워터마크 제거 변형) 생성 → manifest.reelTiktok 기록.
      # 유튜브 업로드 후 실행해 공용 reel-v2.mp4 / manifest.reel 은 그대로 둠.
      - name: 틱톡 전용 릴스 생성 (URL 워터마크 제거)
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',tiktok,') }}
        run: HHS_TIKTOK_VARIANT=1 npm run reel:make:v2

      - name: 틱톡 업로드
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',tiktok,') }}
        run: npm run post:tiktok

      # 성공/실패 모두 채널별 결과를 보고한다. 실패면 안 올라간 채널의 원본 파일도 첨부.
      - name: Telegram 성공 보고
        if: ${{ success() && steps.dup.outputs.skip != 'true' }}
        run: npm run telegram:report

      - name: Telegram 실패 보고 (채널별 + 원본 첨부)
        if: failure()
        run: npm run telegram:failure
