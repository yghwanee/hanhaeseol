name: Evening post (tomorrow schedule, v2)

on:
  schedule:
    # cron UTC 9:18 = KST 18:18. GH Actions 지연 ~3h 관측 → 실제 노출 KST 21시대 (저녁 골든타임).
    # 내일 경기 정보를 자기 전 시청자에게 푸시 (오전 워크플로우는 당일 경기 정보).
    - cron: '18 9 * * *'
  workflow_dispatch:
    inputs:
      skip_instagram:
        description: '인스타 게시 SKIP (only Youtube)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  instagram:
    runs-on: ubuntu-latest
    env:
      # 내일 경기 (=offset 1). 오전 워크플로우는 0 (=당일).
      KST_OFFSET_DAYS: '1'
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
      GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: ffmpeg 확인 (사전 설치돼 있으면 skip)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 토큰 헬스체크
        run: npm run ig:check && npm run tiktok:check

      - name: 카드 생성
        run: npm run post:all -- --no-send

      - name: 릴스 영상 생성 (신규 v2 — punch + xfade zoomin)
        run: npm run reel:make:v2

      - name: 스토리 이미지 생성
        run: npm run story:make

      - name: 이미지/영상을 insta-media 브랜치에 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd generated/instagram
          git init -q
          git checkout -q -b insta-media
          git add -A
          # commit message 에 [vercel skip] 토큰을 박아 Vercel 이 이 브랜치
          # push 의 빌드를 자동 스킵하게 함. insta-media 는 미디어 전용 orphan
          # 브랜치라 Next.js 코드(app/, package.json) 가 없어 빌드 시도 시
          # "Couldn't find any pages or app directory" 로 100% 실패함.
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              commit -q -m "update $(date -u +%F) [vercel skip]"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:insta-media
          echo "✅ insta-media 브랜치 업데이트 완료"

      - name: raw.githubusercontent CDN 반영 대기
        run: sleep 30

      - name: 캐러셀 게시
        if: ${{ inputs.skip_instagram != true }}
        run: npm run post:ig

      - name: 릴스 게시
        if: ${{ always() && inputs.skip_instagram != true }}
        run: npm run post:reel

      - name: 스토리 게시
        if: ${{ always() && inputs.skip_instagram != true }}
        run: npm run post:story

      - name: 유튜브 쇼츠 업로드
        if: always()
        run: npm run post:youtube

      - name: 틱톡 업로드
        if: always()
        run: npm run post:tiktok

      - name: Telegram 성공 알림
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🌙 [저녁] 내일 경기 v2 업로드 완료 (인스타 캐러셀+릴스+스토리, 유튜브 쇼츠, 틱톡)"

      - name: Telegram 실패 알림 + 카드 전송
        if: failure()
        run: npm run telegram:failure
