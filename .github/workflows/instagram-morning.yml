name: Morning post (today schedule)

on:
  schedule:
    # UTC 19:53 = KST 다음날 04:53. 당일 경기 정보를 출근/등교 타임에 푸시
    # (저녁 워크플로우는 내일 경기 정보).
    #
    # 🔴 정시(':00')를 피한다. GH Actions 무료 티어 cron 은 정각에 큐가 가장 붐빈다.
    # 실측: 이 워크플로가 '0 20' 이던 동안 게시 시각이 05:47~06:08 로 안정적이다가
    # 2026-08-07 에 **4시간 50분** 밀려 09:54 에 나갔다("오늘 경기"인데 오전 10시).
    # 저녁 워크플로는 같은 이유로 이미 '18 7' 을 쓰고 있다(그쪽 주석에 지연 실측 있음).
    - cron: '53 19 * * *'
  workflow_dispatch:
    inputs:
      # 종전의 skip_instagram / instagram_only 를 대체한다.
      # 인스타만 = carousel,reel,story / 유튜브만 = youtube
      gated:
        description: '창·중복 검사를 그대로 적용한다 (따라잡기 자동 발동용). 사람이 쓸 일 없음'
        type: string
        default: ''
      only:
        description: '이 채널만 게시 (쉼표 구분: carousel,reel,story,youtube). 비우면 전부'
        type: string
        default: ''

permissions:
  contents: write
  # 사이클·중복 검사가 상대 워크플로의 실행·스텝 결과를 읽는다.
  actions: read

# 🔴 같은 시각에 두 개 이상 돌지 못하게 한다 (2026-09-02).
# 따라잡기 호출처가 셋이라 GH 크론 드리프트로 몇십 초 안에 같이 깨어나는 일이 있고,
# 2026-09-01 에 실제로 아침분이 세 실행에서 전부 게시됐다(같은 콘텐츠 3회).
# post-log 가 그걸 막지만, 세 실행이 **동시에** 로그를 읽으면 셋 다 "없다"를 본다.
# 직렬화가 그 창을 없앤다. 아침·저녁을 한 그룹으로 묶어 서로도 겹치지 않게 한다.
concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    # 직렬화(concurrency)를 걸었으므로 한 실행이 매달리면 다음 사이클까지 막힌다.
    timeout-minutes: 30
    env:
      # 당일 경기 (=offset 0). 저녁 워크플로우는 1 (=내일).
      KST_OFFSET_DAYS: '0'
      # legacy 이미지 세트 사용 (캐러셀 1번 = V7 후킹 카드, 릴스 v1 첫 프레임 = pad=85 V7).
      # 저녁(신규 reel-title-card 4:5)과 시각적으로 구별 — 같은 날 2번 올려도 다른 게시물처럼 보임.
      HHS_LEGACY_MORNING: '1'
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
      GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # post-log(Contents API) 읽기·쓰기 + 실행 이력 조회에 쓴다.
      GH_TOKEN: ${{ github.token }}
      HHS_REPORT_TITLE: '☀️ [오전] 당일 경기'
      HHS_WORKFLOW: instagram-morning.yml
      # 따라잡기가 건 실행은 수동 실행 면제를 주지 않는다(자동 중복 방지).
      HHS_FORCE_GATE: ${{ inputs.gated == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: ffmpeg 확인 (사전 설치돼 있으면 skip)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 토큰 헬스체크
        run: npm run ig:check

      # 이 실행이 어느 날짜를 대상으로 하는지 남긴다. 2026-08-27 사고 때
      # 로그에 대상 날짜가 없어 생성 파일명으로 역추적해야 했다.
      # 🔴 같은 대상 날짜를 두 번 올리는 것을 막는다 (2026-08-29).
      # cron 이 12시간 밀려 저녁분이 자정을 넘겨 돌면, 사이클 보정 덕에 날짜는
      # 맞지만 그 몇 시간 뒤 아침분이 **같은 날짜**를 또 올린다.
      # 워크플로 이름이 아니라 대상 날짜로 비교하므로 정상 운영은 안 막는다.
      # 조회 실패 시엔 게시를 진행한다(fail-open).
      - name: 사이클 창·중복 검사
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run post:cyclecheck

      # 🔴 이번 실행에서 **실제로 올릴 채널**을 정한다 (2026-09-02).
      # post-log 에 이미 있는 채널은 여기서 빠진다 → 워크플로를 통째로 다시 돌려도
      # 성공한 채널은 재게시되지 않고 빠진 것만 다시 시도한다.
      # 남는 게 없으면 skip_all=true 로 미디어 생성부터 전부 건너뛴다(조용히).
      - name: 게시 대상 채널 결정
        id: plan
        if: ${{ steps.dup.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HHS_ONLY: ${{ inputs.only }}
        run: npm run post:plan

      - name: 대상 날짜 확인 (사이클 보정 포함)
        if: ${{ steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        run: npm run post:target

      - name: 카드 생성 (당일 경기)
        if: ${{ steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        run: npm run post:all -- --no-send

      - name: 릴스 영상 생성 (기존 슬라이드쇼)
        if: ${{ steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        run: npm run reel:make

      - name: 스토리 이미지 생성
        if: ${{ steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        run: npm run story:make

      # 🔴 push 앞에 있어야 한다. 인스타에 올리는 이미지는 JPEG 로 굽는다 — Meta 공식
      # 이미지 포맷은 JPEG 뿐이고 PNG 는 그쪽 변환기를 태우는 비공식 경로다.
      # 2026-08-15 아침 캐러셀 8장이 그 변환에서 통째로 죽었다(36001/2207084).
      - name: 인스타 업로드용 JPEG 변환
        if: ${{ steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        run: npm run ig:jpeg

      - name: 이미지/영상을 insta-media 브랜치에 푸시
        if: ${{ steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        id: media
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd generated/instagram
          git init -q
          git checkout -q -b insta-media
          git add -A
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              commit -q -m "morning update $(date -u +%F) [vercel skip]"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:insta-media
          echo "✅ insta-media 브랜치 업데이트 완료"

      - name: raw.githubusercontent CDN 반영 대기
        if: ${{ steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        run: sleep 10

      # 저녁 워크플로와 같은 규칙: 게시 스텝끼리는 독립이되, 미디어 준비(생성 + insta-media
      # push)가 실패하면 게시하지 않는다. 그 브랜치엔 어제 미디어가 남아 있어 그대로 재게시된다.
      - name: 캐러셀 게시
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',carousel,') }}
        run: npm run post:ig

      - name: 릴스 게시
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',reel,') }}
        run: npm run post:reel

      - name: 스토리 게시
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',story,') }}
        run: npm run post:story

      - name: 유튜브 쇼츠 업로드
        if: ${{ !cancelled() && steps.media.outcome == 'success' && contains(steps.plan.outputs.channels, ',youtube,') }}
        run: npm run post:youtube

      # 틱톡은 저녁 워크플로우(instagram.yml)에서만 게시. 오전엔 제외(1일 1회 = 도배 신호 완화).

      - name: Telegram 성공 보고
        if: ${{ success() && steps.dup.outputs.skip != 'true' && steps.plan.outputs.skip_all != 'true' }}
        run: npm run telegram:report

      - name: Telegram 실패 보고 (채널별 + 원본 첨부)
        if: failure()
        run: npm run telegram:failure
