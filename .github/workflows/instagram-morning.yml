name: Morning post (today schedule)

on:
  schedule:
    # UTC 20:00 = KST 다음날 05:00. GH Actions 지연 1~2h 고려하면 실제 KST 06~07시 노출.
    # 당일 경기 정보를 출근/등교 타임에 푸시 (저녁 워크플로우는 내일 경기 정보).
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      skip_instagram:
        description: '인스타 게시 SKIP (only Youtube)'
        type: boolean
        default: false
      instagram_only:
        description: '인스타만 게시 (유튜브 SKIP — 부분 실패 재실행용)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    env:
      # 당일 경기 (=offset 0). 저녁 워크플로우는 1 (=내일).
      KST_OFFSET_DAYS: '0'
      # legacy 이미지 세트 사용 (캐러셀 1번 = V7 후킹 카드, 릴스 v1 첫 프레임 = pad=85 V7).
      # 저녁(신규 reel-title-card 4:5)과 시각적으로 구별 — 같은 날 2번 올려도 다른 게시물처럼 보임.
      HHS_LEGACY_MORNING: '1'
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
      GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: ffmpeg 확인 (사전 설치돼 있으면 skip)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 토큰 헬스체크
        run: npm run ig:check

      - name: 카드 생성 (당일 경기)
        run: npm run post:all -- --no-send

      - name: 릴스 영상 생성 (기존 슬라이드쇼)
        run: npm run reel:make

      - name: 스토리 이미지 생성
        run: npm run story:make

      - name: 이미지/영상을 insta-media 브랜치에 푸시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd generated/instagram
          git init -q
          git checkout -q -b insta-media
          git add -A
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              commit -q -m "morning update $(date -u +%F) [vercel skip]"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:insta-media
          echo "✅ insta-media 브랜치 업데이트 완료"

      - name: raw.githubusercontent CDN 반영 대기
        run: sleep 10

      - name: 캐러셀 게시
        if: ${{ inputs.skip_instagram != true }}
        run: npm run post:ig

      - name: 릴스 게시
        if: ${{ always() && inputs.skip_instagram != true }}
        run: npm run post:reel

      - name: 스토리 게시
        if: ${{ always() && inputs.skip_instagram != true }}
        run: npm run post:story

      - name: 유튜브 쇼츠 업로드
        if: ${{ always() && inputs.instagram_only != true }}
        run: npm run post:youtube

      # 틱톡은 저녁 워크플로우(instagram.yml)에서만 게시. 오전엔 제외(1일 1회 = 도배 신호 완화).

      - name: Telegram 성공 알림
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="☀️ [오전] 당일 경기 업로드 완료 (인스타 캐러셀+릴스+스토리, 유튜브 쇼츠)"

      - name: Telegram 실패 알림 + 카드 전송
        if: failure()
        run: npm run telegram:failure
