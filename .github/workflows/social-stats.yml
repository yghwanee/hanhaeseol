name: Social Stats

# 인스타·유튜브 쇼츠·틱톡 실적 조회. 게시는 자동으로 도는데 숫자를 본 적이 없어서 만들었다.
# 수동 실행 + 주 1회. 결과는 로그와 텔레그램 양쪽에 남긴다.
on:
  schedule:
    - cron: "0 22 * * 0" # 매주 월요일 07:00 KST
  workflow_dispatch: {}

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: 실적 조회
        id: stats
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        run: |
          out=$(npx tsx src/scripts/social-stats.ts)
          echo "$out"
          {
            echo "report<<HHS_EOF"
            echo "$out"
            echo "HHS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 텔레그램 전송
        if: always() && steps.stats.outputs.report != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT: ${{ steps.stats.outputs.report }}
        run: |
          MSG=$(printf '%s\n' '📊 소셜 채널 실적' '' "${REPORT}")
          # 텔레그램 한 메시지 한계 4096자(UTF-8 문자 기준). 넘으면 400 "message is too long"
          # 인데 curl -s 는 exit 0 이라 조용히 안 간다(2026-07-26 #25 사고와 같은 함정).
          # cut/head 는 바이트나 줄 단위라 한글에서 어긋난다 → node 로 문자 단위 자르기.
          MSG=$(node -e 'const s=process.argv[1];process.stdout.write(s.length>3800?s.slice(0,3800)+"\n…(생략)":s)' "$MSG")
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}")
          case "$RESP" in
            *'"ok":true'*) echo "텔레그램 전송 완료" ;;
            *) echo "::error::텔레그램 전송 실패: $RESP"; exit 1 ;;
          esac
