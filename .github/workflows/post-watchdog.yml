name: 소셜 게시 감시

# 사이클 마감 점검. **짖기 전에 직접 돌린다.**
#
# 🔴 2026-09-02 전면 교체. 종전(bash)은 GH 실행 이력에서 "게시 스텝이 하나라도
# success 인 실행이 있는가" 만 봤다. 그래서
#   ① 5개 중 3개만 올라간 날을 정상으로 통과시켰고(부분 실패는 밤새 방치),
#   ② 문제를 발견하면 "gh workflow run 하세요" 라고 사람에게 미뤘다.
# 그 문장이 그대로 알림이 됐다.
#
# 이제 판정은 data/post-log.json 의 **채널 단위**이고, 빠진 게 있으면 스스로
# 복구를 건다. 게시 스크립트가 이미 올라간 채널을 건너뛰므로 통째 재실행이 안전하다.
#
#   빠진 채널 없음               → 조용히 끝
#   빠졌고 복구 안 걸었음        → 복구 dispatch, 알림 없음
#   빠졌고 복구도 이미 걸었음    → 이때만 한 통 (사이클당 1회)
on:
  schedule:
    - cron: '7 3 * * *'    # KST 12:07 — 아침 사이클 마감 점검
    - cron: '7 14 * * *'   # KST 23:07 — 저녁 사이클 마감 점검
  workflow_dispatch:
    inputs:
      cycle:
        description: '점검할 사이클 (morning | evening). 비우면 현재 KST 시각으로 판단'
        type: string
        default: ''
      dry_run:
        description: '판정만 하고 발동·알림을 하지 않는다'
        type: boolean
        default: false

permissions:
  contents: write   # post-log 에 복구·경고 표시를 남긴다
  actions: write    # 놓친 게시 워크플로를 dispatch 한다

concurrency:
  group: post-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: 사이클 마감 점검 · 복구
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 🔴 크론별로 사이클을 명시한다. 시각으로 유추하면 낮 크론(KST 12:07)이
          # 저녁으로 떨어져, 저녁 예약(16:18)이 오기도 전에 복구를 걸어 버린다.
          HHS_WATCHDOG_CYCLE: >-
            ${{ inputs.cycle
                || (github.event.schedule == '7 3 * * *' && 'morning')
                || (github.event.schedule == '7 14 * * *' && 'evening')
                || '' }}
          HHS_WATCHDOG_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: npm run post:watchdog
