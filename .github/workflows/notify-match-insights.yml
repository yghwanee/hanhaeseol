name: Notify Match Insights

# 매일 08:43 KST = 23:43 UTC (전날). 04:23 생성 결과를 ~4시간 뒤에 텔레그램으로 발송.
# :00 정각은 GH Actions 글로벌 큐 혼잡으로 지연이 가장 큼 → :43으로 회피.
on:
  schedule:
    - cron: '43 23 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY_PATH="src/data/insights-summary.json"
          if [ ! -f "$SUMMARY_PATH" ]; then
            MSG="❌ 관전 포인트 요약 파일 없음 (생성 워크플로우가 안 돌았을 수 있음)"
          else
            # already-exists = 이미 만들어둔 것 재활용(정상, Gemini 호출 안 함).
            # 그 외 스킵(gemini-429 등)만 '진짜 실패'로 분리 표기해 매일 오탐 놀람을 없앤다.
            MSG=$(node -e '
              const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const reasons = s.skipReasons || {};
              const reused = reasons["already-exists"] || 0;
              const fails = Object.entries(reasons).filter(([k]) => k !== "already-exists");
              const failCount = fails.reduce((a, [, n]) => a + n, 0);
              const health = failCount === 0 ? "✅" : "⚠️";
              const lines = [
                "✨ AI 관전 포인트 (오늘)",
                "",
                `대상 ${s.targets}경기 (한국어해설만)`,
                `생성 ${s.created} · 재활용 ${reused} · 실패 ${failCount} ${health}`,
              ];
              if (failCount > 0) {
                const detail = fails.map(([k, n]) => `${k} ${n}`).join(", ");
                lines.push(`실패 사유: ${detail}`);
                if (reasons["gemini-429"]) {
                  lines.push("(429 = 무료 quota 소진. 며칠에 걸쳐 자동 충전됨)");
                }
              }
              lines.push("", `생성 시각: ${s.timestamp}`);
              console.log(lines.join("\n"));
            ' "$SUMMARY_PATH")
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
