name: Crawl Starting Pitchers

on:
  schedule:
    # KST 03:07 / 10:07 / 21:07 = UTC 18:07(전날) / 01:07 / 12:07
    # 정각(:00)은 GitHub Actions 큐 혼잡으로 지연되므로 7분 오프셋(프로젝트 관례).
    - cron: '7 18 * * *'
    - cron: '7 1 * * *'
    - cron: '7 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Crawl starters
        run: npm run crawl:starters

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add src/data/starters.json
          if git diff --staged --quiet; then
            echo "No starter changes"
          else
            git commit -m "chore: update starting pitchers"
            git push
          fi
