name: Crawl Starting Pitchers

on:
  schedule:
    # KST 03:47 / 10:47 / 21:47 = UTC 18:47(전날) / 01:47 / 12:47
    # 정각·정각직후 재시도 러시 회피를 위해 47분 오프셋.
    - cron: '47 18 * * *'
    - cron: '47 1 * * *'
    - cron: '47 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Crawl starters
        run: npm run crawl:starters

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add src/data/starters.json
          if git diff --staged --quiet; then
            echo "No starter changes"
          else
            git commit -m "chore: update starting pitchers"
            git push
          fi
