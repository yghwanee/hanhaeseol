name: Notify Content Ideas

# 월드컵 글감 제안 클라우드 루틴이 "[글감]" 제목으로 이슈를 열면 텔레그램으로 내용을 보낸다.
# 클라우드 루틴은 텔레그램 토큰에 직접 접근 못 하므로, 토큰을 가진 GitHub Actions가 "다리" 역할.
# (notify-draft-pr.yml과 동일 패턴, 트리거만 issues opened)
on:
  issues:
    types: [opened]

jobs:
  notify:
    # 글감 제안 이슈만 알린다.
    if: startsWith(github.event.issue.title, '[글감]')
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          MSG=$(printf '%s\n' \
            "💡 이번 주 월드컵 글감 제안이 왔어요" \
            "" \
            "${ISSUE_BODY}" \
            "" \
            "고른 글감으로 큐(docs/content-plan.md) 세팅하세요:" \
            "${ISSUE_URL}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
