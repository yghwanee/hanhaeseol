name: Crawl Results & Records (hourly)

on:
  schedule:
    # 매시 13분 + 43분 2회 (정각·5의 배수·정각직후 재시도 러시 회피 + 분산).
    # GH Actions의 schedule cron은 부하 시 누락되는 알려진 한계가 있어
    # 시간당 2번으로 분산해 누락 확률을 낮춘다. concurrency가 직렬화하므로
    # 두 트리거가 겹쳐도 데이터 중복 없이 순차 실행.
    # 비용 우려는 없음(퍼블릭 리포는 Actions 무제한).
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

# 동시 실행 방지: 이전 잡이 끝나기 전에 다음 cron이 트리거되면 큐에 쌓지 않고 스킵.
concurrency:
  group: crawl-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Run results crawl
        run: npm run crawl:results

      # 스코어와 함께 매시 갱신해 카드의 최근 5경기/연승/연패 표시를 빠르게 반영.
      # results 실패 시(0건이면 exit 1) records는 다음 cron에 재시도된다.
      - name: Run team records crawl
        run: npm run crawl:records

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/results.json public/results.json src/data/results-archive.json public/results-archive.json src/data/team-records.json public/team-records.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update results & team records (hourly)"
            # 동일 시간대에 다른 워크플로가 push했을 가능성 → rebase로 흡수.
            git pull --rebase origin main
            git push
          fi
