name: Crawl Results & Records (hourly)

on:
  schedule:
    # 매시 13분 + 43분 2회 (정각·5의 배수·정각직후 재시도 러시 회피 + 분산).
    # GH Actions의 schedule cron은 부하 시 누락되는 알려진 한계가 있어
    # 시간당 2번으로 분산해 누락 확률을 낮춘다. concurrency가 직렬화하므로
    # 두 트리거가 겹쳐도 데이터 중복 없이 순차 실행.
    # 비용 우려는 없음(퍼블릭 리포는 Actions 무제한).
    # 🔴 2026-09-01: 매시 2회(13,43) → 1회. 배포가 하루 4회뿐이라(작업92) 30분마다
    # 크롤해도 사이트에 반영되는 시점은 같다. 반대로 고빈도 cron 은 GH 가 먼저 버려서
    # 레포 전체 예약 발화를 깎아먹고 있었다(하루 48회 요구에 실측 4~6회 발화).
    - cron: '13 * * * *'
  workflow_dispatch: {}

# 동시 실행 방지: 이전 잡이 끝나기 전에 다음 cron이 트리거되면 큐에 쌓지 않고 스킵.
concurrency:
  group: crawl-results
  cancel-in-progress: false

permissions:
  contents: write



jobs:
  # 🔴 소셜 게시 따라잡기 (2026-09-01). 이 워크플로가 도는 김에, 놓친 게시가 있으면
  # 대신 걸어 준다. GH Actions 가 예약 발화를 대량으로 버리기 때문에, 게시 cron 하나에
  # 하루를 걸지 않고 **그날 살아남은 실행 아무거나**에 구제를 얹는다.
  catchup:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/post-catchup.yml
    secrets: inherit

  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Run results crawl
        run: npm run crawl:results
        env:
          # 종료된 축구 경기 하이라이트 영상ID 검색용(YouTube Data API v3).
          # 미설정 시 하이라이트 검색은 조용히 건너뜀.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # 스코어와 함께 매시 갱신해 카드의 최근 5경기/연승/연패 표시를 빠르게 반영.
      # results 실패 시(0건이면 exit 1) records는 다음 cron에 재시도된다.
      - name: Run team records crawl
        run: npm run crawl:records

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/results.json public/results.json src/data/results-archive.json public/results-archive.json src/data/team-records.json public/team-records.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update results & team records (hourly)"
            # 동일 시간대에 다른 워크플로가 push했을 가능성 → rebase로 흡수. 사이에 또 끼면 재시도.
            # 🔴 5회를 다 쓰고도 실패하면 **반드시 실패시킨다**. 종전엔 루프의 마지막 명령이
            # sleep 이라 스텝이 exit 0 으로 끝나, 스코어가 몇 시간째 안 올라가도 워크플로는
            # 계속 초록이었다(무성 실패).
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=true; break; fi
              echo "push 충돌, 재시도 $i/5..."; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::5회 재시도에도 push 실패 — 결과 데이터가 반영되지 않았습니다."
              exit 1
            fi
          fi
