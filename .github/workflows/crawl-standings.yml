name: Crawl Standings (extra)

on:
  schedule:
    # KST 01:23 = UTC 16:23 (하루 1회 추가)
    # 정각·정각직후 재시도 러시 회피를 위해 23분에 시작
    - cron: '23 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Run standings crawl
        run: npm run crawl:standings

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/standings.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update standings data (extra 01:00 KST)"
            # 5회를 다 쓰고도 실패하면 실패시킨다(루프 마지막이 sleep 이라 무성 성공하던 것 수정).
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=true; break; fi
              echo "push 충돌, 재시도 $i/5..."; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::5회 재시도에도 push 실패 — 순위 데이터가 반영되지 않았습니다."
              exit 1
            fi
          fi
