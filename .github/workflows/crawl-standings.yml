name: Crawl Standings (extra)

on:
  schedule:
    # KST 01:00 = UTC 16:00 (하루 1회 추가)
    # 정각 회피를 위해 07분에 시작
    - cron: '07 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Run standings crawl
        run: npm run crawl:standings

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/standings.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update standings data (extra 01:00 KST)"
            git pull --rebase origin main
            git push
          fi
