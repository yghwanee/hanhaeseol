name: Generate Match Insights

on:
  schedule:
    # 매일 04:23 KST = 19:23 UTC (전날). 당일분(D-day)만 생성.
    # :00 정각은 GH Actions 글로벌 큐 혼잡으로 지연이 가장 큼 → :23으로 회피.
    # (실측: 큐 지연으로 ~06:56 KST 실행 — 경기 당일 아침에 그날 경기 인사이트 생성.)
    # 당일분 ~20건/일 → 무료 티어 Google Search grounding 일일 quota(~20여건) 안에 수렴해 429 회피.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'How many days ahead (default 6 = full 7-day window)'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Generate insights
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 하루치(D-day)만 생성. 무료 티어 Google Search grounding 일일 quota(~20여건)에
          # 맞춰 7일치(~100건/일) → 당일분(~20건/일)으로 축소해 429 소진을 회피.
          # 경기 당일 아침 생성이라 순위/폼 컨텍스트도 가장 신선. 수동 dispatch로 backfill 가능.
          INSIGHTS_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '0' }}
          # 당일분을 매일 아침 최신 데이터로 overwrite (stale 방지).
          INSIGHTS_FORCE_REGEN: "true"
        run: npm run insights:generate

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add src/data/match-insights/ src/data/insights-summary.json
          if git diff --staged --quiet; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No insight changes"
          else
            git commit -m "chore: regenerate match insights"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          fi
