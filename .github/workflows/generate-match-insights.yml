name: Generate Match Insights

on:
  schedule:
    # 매일 04:23 KST = 19:23 UTC (전날). 당일분(D-day)만 생성.
    # :00 정각은 GH Actions 글로벌 큐 혼잡으로 지연이 가장 큼 → :23으로 회피.
    # (실측: 큐 지연으로 ~06:56 KST 실행 — 경기 당일 아침에 그날 경기 인사이트 생성.)
    # 당일분 ~20건/일 → 무료 티어 Google Search grounding 일일 quota(~20여건) 안에 수렴해 429 회피.
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'How many days ahead (default 6 = full 7-day window).'
        required: false
        default: '6'
      disable_grounding:
        description: 'Google Search grounding 끄기 (대량 백필 시 true → grounding quota 회피)'
        required: false
        default: 'false'
      force_regen:
        description: '이미 생성된 인사이트도 재생성 (false면 스킵 → 며칠에 걸친 백필에 유용)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Generate insights
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # gemini-2.5-flash 무료 한도는 실측 generate_content 20요청/일이라, 7일치(~100건/일)를
          # 다 돌리면 429로 소진된다. 이미 생성된 건 Gemini 호출 전에 스킵(generate.ts L22)하므로
          # 매일 조금씩 채워지고, 경기 당일 아침 생성이라 순위/폼 컨텍스트도 가장 신선하다.
          # 대량 백필이 필요하면 수동 dispatch 로 days_ahead 를 넓힐 것.
          #
          # 2026-07-30: 월드컵 백필 모드(days_ahead 기본 44, worldcup_only 입력)를 걷어냈다.
          # 대회가 끝나 worldcup.json 에 미래 경기가 없고, 일반 경기는 schedule.json 이 7일치뿐이라
          # 44 와 6 이 동작상 같았다(과거 경기는 inDateRange 범위 밖). 워크플로 주석이 스스로
          # "대회 종료 후 정리할 것"이라 적어둔 항목이다.
          INSIGHTS_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '6' }}
          INSIGHTS_FORCE_REGEN: ${{ github.event.inputs.force_regen || 'false' }}
          INSIGHTS_DISABLE_GROUNDING: ${{ github.event.inputs.disable_grounding || 'false' }}
        run: npm run insights:generate

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/match-insights/ src/data/insights-summary.json
          if git diff --staged --quiet; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No insight changes"
          else
            git commit -m "chore: regenerate match insights"
            # 매시 결과 크롤(:13/:43)과 겹치면 non-fast-forward 로 거절된다 → 재시도.
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=true; break; fi
              echo "push 충돌, 재시도 $i/5..."; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::5회 재시도에도 push 실패 — 인사이트가 반영되지 않았습니다."
              exit 1
            fi
            echo "updated=true" >> $GITHUB_OUTPUT
          fi
