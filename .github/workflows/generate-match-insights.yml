name: Generate Match Insights

on:
  schedule:
    # 매일 04:23 KST = 19:23 UTC (전날). 7일치(D-day~D+6) 생성.
    # :00 정각은 GH Actions 글로벌 큐 혼잡으로 지연이 가장 큼 → :23으로 회피.
    # 이미 생성된 매치는 readInsight() 체크로 skip되므로 매일 추가분만 LLM 호출.
    # 한국어해설 7일치 ~107건 / Gemini 무료 한도 1,500/일(7%), 4.5s sleep 분당 13.3req(<15 RPM).
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'How many days ahead (default 6 = full 7-day window)'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Generate insights
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSIGHTS_DAYS_AHEAD: ${{ github.event.inputs.days_ahead || '6' }}
          # 매일 04:00에 7일치 전부 overwrite. 팀 폼/순위/연승은 매일 바뀌므로 stale 방지가 필요.
          # 일 호출 ~107회는 Gemini 무료 한도 1500의 7%로 안전.
          INSIGHTS_FORCE_REGEN: "true"
        run: npm run insights:generate

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add src/data/match-insights/ src/data/insights-summary.json
          if git diff --staged --quiet; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No insight changes"
          else
            git commit -m "chore: regenerate match insights"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          fi
