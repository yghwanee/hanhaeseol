name: Crawl Schedules

on:
  schedule:
    # KST 08:18 = UTC 23:18 (하루 1회)
    - cron: '18 23 * * *'
  workflow_dispatch: {}  # 수동 트리거

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Run crawl
        id: crawl
        run: |
          npm run crawl 2>&1 | tee crawl.log
          if grep -q "쿠팡플레이: 토큰 갱신 실패" crawl.log; then
            echo "coupang_failed=true" >> $GITHUB_OUTPUT
          else
            echo "coupang_failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          COUPANG_CT_LSID: ${{ secrets.COUPANG_CT_LSID }}
          COUPANG_DEVICE_ID: ${{ secrets.COUPANG_DEVICE_ID }}
          COUPANG_MEMBER_SRL: ${{ secrets.COUPANG_MEMBER_SRL }}
          COUPANG_PROFILE_ID: ${{ secrets.COUPANG_PROFILE_ID }}
          COUPANG_TOKEN: ${{ secrets.COUPANG_TOKEN }}
          COUPANG_P_AT: ${{ secrets.COUPANG_P_AT }}

      # 팀 기록(최근 5경기/연승) 크롤은 crawl-results.yml(매시) 로 이관됨.

      - name: Run standings crawl
        run: npm run crawl:standings

      # 월드컵 편성은 schedule.json과 분리된 worldcup.json으로 관리(네이버 소스).
      # 실패해도 전체 워크플로우는 통과시킨다(기존 데이터 보존).
      - name: Run worldcup crawl
        continue-on-error: true
        run: npm run crawl:worldcup

      - name: Commit & Push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/schedule.json public/schedule.json src/data/schedule-archive.json public/schedule-archive.json src/data/standings.json src/data/worldcup.json public/worldcup.json
          if git diff --staged --quiet; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update schedule data"
            git pull --rebase origin main
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Vercel 빌드 확인 & 실패 시 1회 재시도
        id: vercel
        if: steps.commit.outputs.updated == 'true'
        timeout-minutes: 20
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          echo "추적 대상 commit: $SHA"

          # Vercel API에서 SHA에 매칭되는 가장 최신 production deployment 상태 조회.
          # 반환: READY / ERROR / CANCELED / BUILDING / INITIALIZING / QUEUED / NOT_FOUND / PARSE_ERR
          fetch_state() {
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?limit=20&target=production" \
              | node -e "
                let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{
                  try{
                    const j=JSON.parse(s);
                    const m=(j.deployments||[]).find(x=>x.meta&&x.meta.githubCommitSha===process.env.SHA);
                    process.stdout.write(m? m.state : 'NOT_FOUND');
                  }catch(e){process.stdout.write('PARSE_ERR');}
                });"
          }

          # 종료 상태(READY/ERROR/CANCELED) 나올 때까지 폴링. 인자: timeout(분)
          # 반환 코드: 0=READY, 1=ERROR/CANCELED, 2=TIMEOUT. stdout에 마지막 state.
          poll() {
            local timeout_min=$1
            local end=$(( $(date +%s) + timeout_min*60 ))
            local state=""
            while [ "$(date +%s)" -lt "$end" ]; do
              state=$(fetch_state)
              echo "[$(date -u +%H:%M:%S)] state=$state" >&2
              case "$state" in
                READY) echo "$state"; return 0 ;;
                ERROR|CANCELED) echo "$state"; return 1 ;;
                *) sleep 20 ;;
              esac
            done
            echo "TIMEOUT"
            return 2
          }

          # 1차: Vercel 자동 빌드 결과 대기 (최대 6분)
          set +e
          FIRST=$(poll 6)
          rc=$?
          set -e
          echo "1차 결과: $FIRST (rc=$rc)"

          if [ $rc -eq 0 ]; then
            echo "retried=false" >> $GITHUB_OUTPUT
            echo "final=READY" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$FIRST" = "TIMEOUT" ]; then
            # 1차 빌드 상태를 6분 내 확정하지 못함. 재시도하면 중복 빌드 위험 → 그냥 종료.
            echo "retried=false" >> $GITHUB_OUTPUT
            echo "final=TIMEOUT" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "1차 빌드 실패($FIRST). Deploy Hook 호출하여 재시도."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null
          sleep 30

          # 2차: 재시도 빌드 결과 대기 (최대 8분)
          set +e
          SECOND=$(poll 8)
          rc=$?
          set -e
          echo "2차 결과: $SECOND (rc=$rc)"
          echo "retried=true" >> $GITHUB_OUTPUT

          if [ $rc -eq 0 ]; then
            echo "final=READY" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "final=$SECOND" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: IndexNow 핵심 페이지 ping
        # Vercel READY 확인 직후에만 호출. 빌드 전이면 새 URL이 아직 404일 수 있어
        # ping 의미 없음. 실패해도 본 워크플로우는 통과(continue-on-error)시킴.
        if: steps.commit.outputs.updated == 'true' && steps.vercel.outputs.final == 'READY'
        continue-on-error: true
        run: npm run seo:indexnow

      - name: Telegram 알림 (1차 빌드 성공)
        if: steps.commit.outputs.updated == 'true' && steps.crawl.outputs.coupang_failed == 'false' && steps.vercel.outputs.final == 'READY' && steps.vercel.outputs.retried == 'false'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ 한해설 편성표가 업데이트되었습니다." \
            -d parse_mode=HTML

      - name: Telegram 알림 (재시도 후 성공)
        if: steps.commit.outputs.updated == 'true' && steps.crawl.outputs.coupang_failed == 'false' && steps.vercel.outputs.final == 'READY' && steps.vercel.outputs.retried == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ 한해설 편성표가 업데이트되었습니다. (Vercel 1차 빌드 실패 → 자동 재시도 성공)" \
            -d parse_mode=HTML

      - name: Telegram 알림 (Vercel 빌드 실패)
        if: always() && steps.commit.outputs.updated == 'true' && steps.vercel.outputs.final != 'READY' && steps.vercel.outputs.final != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINAL: ${{ steps.vercel.outputs.final }}
          RETRIED: ${{ steps.vercel.outputs.retried }}
        run: |
          MSG=$(printf '%s\n' \
            "🚨 Vercel 빌드 실패" \
            "" \
            "데이터는 GitHub에 push되었으나 사이트에 반영되지 못했습니다." \
            "최종 상태: ${FINAL}" \
            "재시도 여부: ${RETRIED}" \
            "" \
            "Vercel 대시보드에서 수동 Redeploy 필요" \
            "https://vercel.com/yghwanees-projects/hanhaeseol/deployments")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: Telegram 알림 (쿠팡플레이 토큰 만료)
        if: steps.crawl.outputs.coupang_failed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '%s\n' \
            "🚨 쿠팡플레이 토큰 만료" \
            "" \
            "기존 데이터로 유지 중이지만, 새 경기 정보를 가져오지 못합니다." \
            "" \
            "토큰 갱신 방법" \
            "1. coupangplay.com 로그인" \
            "2. F12 → Application → Cookies" \
            "" \
            "COUPANG_P_AT → P_AT 쿠키 값" \
            "COUPANG_CT_LSID → CT_LSID 쿠키 값" \
            "COUPANG_TOKEN → token 쿠키 값" \
            "COUPANG_DEVICE_ID → device_id 쿠키 값" \
            "COUPANG_MEMBER_SRL → member_srl 쿠키 값" \
            "" \
            "GitHub Secrets 업데이트 (필수)" \
            "https://github.com/yghwanee/hanhaeseol/settings/secrets/actions" \
            "" \
            "업데이트 후 Actions에서 Run workflow로 수동 실행해주세요.")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
