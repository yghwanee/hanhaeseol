name: Crawl Schedules

on:
  schedule:
    # primary: KST 08:18 = UTC 23:18 (하루 1회)
    - cron: '18 23 * * *'
    # backup: GitHub schedule 이벤트는 best-effort라 부하 시 드롭될 수 있음.
    # primary가 드롭되면 아래 백업이 따라잡는다. 정각/:18분 회피(부하 회피).
    # 가드 job이 "오늘 이미 갱신됐으면 스킵"하므로 primary 성공 시 백업은 즉시 종료.
    - cron: '48 1 * * *'   # KST 10:48 = UTC 01:48
    - cron: '48 4 * * *'   # KST 13:48 = UTC 04:48
  workflow_dispatch: {}  # 수동 트리거

# 백업 cron + 수동 트리거가 겹쳐 같은 워크플로 두 인스턴스가 동시에 커밋/푸시하는 걸 방지.
concurrency:
  group: crawl-schedules
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 오늘(KST) 이미 schedule.json이 갱신됐는지 확인. 갱신됐으면 crawl job 전체 스킵.
  # 수동 실행은 무조건 통과. lastUpdated를 못 읽으면 fail-open(안전하게 실행).
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "수동 실행 → 무조건 실행"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(node -e "try{process.stdout.write(String(require('./src/data/schedule.json').lastUpdated||''))}catch(e){process.stdout.write('')}")
          if [ -z "$LAST" ]; then
            echo "lastUpdated 못 읽음 → fail-open(실행)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_KST=$(TZ=Asia/Seoul date -d "$LAST" +%F)
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          echo "schedule.json lastUpdated(KST): $LAST_KST / 오늘(KST): $TODAY_KST"
          if [ "$LAST_KST" = "$TODAY_KST" ]; then
            echo "이미 오늘 갱신됨 → 백업 스킵"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "오늘 갱신 안 됨 → 실행"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Run crawl
        id: crawl
        run: |
          npm run crawl 2>&1 | tee crawl.log
          if grep -q "쿠팡플레이: 토큰 갱신 실패" crawl.log; then
            echo "coupang_failed=true" >> $GITHUB_OUTPUT
          else
            echo "coupang_failed=false" >> $GITHUB_OUTPUT
          fi
        env:
          COUPANG_CT_LSID: ${{ secrets.COUPANG_CT_LSID }}
          COUPANG_DEVICE_ID: ${{ secrets.COUPANG_DEVICE_ID }}
          COUPANG_MEMBER_SRL: ${{ secrets.COUPANG_MEMBER_SRL }}
          COUPANG_PROFILE_ID: ${{ secrets.COUPANG_PROFILE_ID }}
          COUPANG_TOKEN: ${{ secrets.COUPANG_TOKEN }}
          COUPANG_P_AT: ${{ secrets.COUPANG_P_AT }}

      # 팀 기록(최근 5경기/연승) 크롤은 crawl-results.yml(매시) 로 이관됨.

      - name: Run standings crawl
        run: npm run crawl:standings

      # 크롤이 만든 데이터를 가드로 검사한다.
      #
      # 🔴 이게 없으면 어제(2026-07-28) 만든 데이터 스캔 가드가 실제로 일하지 않는다.
      # test.yml 은 `paths` 로 `src/data/**` 를 제외하므로(하루 수십 번 헛도는 걸 막기 위함)
      # **정작 그 데이터를 만드는 커밋에서는 가드가 돌지 않는다.** 크롤러가 오염된 팀명이나
      # 파싱 실패 행을 들여와도 다음에 누가 코드를 푸시할 때까지 아무도 모른다.
      # 팀명 파싱은 이 워크플로(편성 크롤)에서만 일어나므로 여기서 검사하는 게 맞다.
      #
      # **실패해도 커밋은 계속한다.** 가드 하나 때문에 편성표 갱신 전체를 막으면
      # 사용자가 보는 데이터가 하루 낡는다. 대신 텔레그램으로 알린다(아래 별도 스텝).
      - name: 데이터 위생 가드
        id: dataguard
        continue-on-error: true
        run: |
          npm run test:team-name-hygiene
          npm run test:schedule-quality
          npm run test:team-full-names

      - name: Commit & Push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/schedule.json public/schedule.json src/data/schedule-archive.json public/schedule-archive.json src/data/standings.json
          if git diff --staged --quiet; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update schedule data"
            # 다른 크롤 워크플로가 사이에 push하면 non-fast-forward로 거절될 수 있어 재시도.
            # 🔴 다 실패하면 여기서 끊는다. 종전엔 루프가 exit 0 으로 끝나 `updated=true` 가
            # 그대로 찍혔고, push 도 안 된 SHA 로 Vercel 배포를 6분간 기다리다 TIMEOUT 으로
            # 죽었다 — 실패 원인이 "빌드 실패"로 잘못 보고되는 경로였다.
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=true; break; fi
              echo "push 충돌, 재시도 $i/5..."; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::5회 재시도에도 push 실패 — 편성 데이터가 반영되지 않았습니다."
              exit 1
            fi
            echo "updated=true" >> $GITHUB_OUTPUT
            # 🔴 rebase 후의 **실제 커밋 SHA**. 아래 Vercel 폴링이 추적할 대상이다.
            #   github.sha 를 쓰면 안 된다(= 워크플로를 트리거한 시점의 main HEAD).
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Vercel 배포 트리거 & 확인
        id: vercel
        if: steps.commit.outputs.updated == 'true'
        timeout-minutes: 25
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          SHA: ${{ steps.commit.outputs.sha }}
          PROJECT: hanhaeseol
          SITE_URL: https://haeseol.com/
        run: |
          set -uo pipefail
          echo "push 한 commit: $SHA"

          # 🔴 2026-08-18: git push 로는 더 이상 배포가 안 된다(vercel.json
          #    git.deploymentEnabled=false). 커밋 메시지 [vercel skip] 이 실제로는
          #    안 먹는 걸 실측으로 확인해서, 배포를 커밋이 아니라 **우리가 부르는
          #    횟수**로 결정하도록 바꿨기 때문이다. 그래서 편성이 갱신되면
          #    여기서 Deploy Hook 을 직접 불러야 사이트에 올라간다.

          # 최신 프로덕션 배포의 id/state 를 돌려준다.
          # 반환 예: "dpl_abc READY" / "NONE NOT_FOUND" / "NONE API_ERR"
          latest() {
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?limit=1&target=production&projectId=$PROJECT" \
              | node -e "
                let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{
                  let j; try{ j=JSON.parse(s); }catch(e){ return process.stdout.write('NONE API_ERR'); }
                  if(j.error || !Array.isArray(j.deployments)) return process.stdout.write('NONE API_ERR');
                  const d=j.deployments[0];
                  process.stdout.write(d ? (d.uid||d.id)+' '+d.state : 'NONE NOT_FOUND');
                });"
          }

          # 계정 차단(402 DEPLOYMENT_DISABLED) 판별. 사용량 초과·결제 문제로 계정이
          # 잠기면 배포가 **아예 생기지 않아** 폴링이 영원히 헛돈다. 이때는 Redeploy 도
          # Deploy Hook 도 무의미하므로 안내 문구가 달라야 한다(2026-08-17 실제 사례).
          site_error() {
            curl -sS -o /dev/null -D - "$SITE_URL" 2>/dev/null \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-vercel-error"{print $2}' | head -1
          }

          # 🔴 훅을 부르기 **전에** 현재 최신 배포 id 를 기억한다. 이게 없으면
          #    훅 배포가 생기기 전에 폴링이 직전 배포(이미 READY)를 보고 곧바로
          #    "성공"이라 판정한다.
          BASE_ID=$(latest | cut -d' ' -f1)
          echo "기준 배포 id: $BASE_ID"

          # 새 배포가 생겨서 종료 상태가 될 때까지 폴링. 인자: timeout(분)
          # 반환 0=READY, 1=ERROR/CANCELED, 2=TIMEOUT(stdout 에 TIMEOUT_<state>)
          poll() {
            local timeout_min=$1
            local end=$(( $(date +%s) + timeout_min*60 ))
            local state="NONE"
            while [ "$(date +%s)" -lt "$end" ]; do
              local row id
              row=$(latest); id=${row%% *}; state=${row##* }
              if [ "$id" = "$BASE_ID" ]; then
                echo "[$(date -u +%H:%M:%S)] 새 배포 아직 없음(id=$id)" >&2
                state="NO_NEW"
              else
                echo "[$(date -u +%H:%M:%S)] id=$id state=$state" >&2
                case "$state" in
                  READY) echo "$state"; return 0 ;;
                  ERROR|CANCELED) echo "$state"; return 1 ;;
                esac
              fi
              sleep 20
            done
            echo "TIMEOUT_$state"
            return 2
          }

          trigger() {
            code=$(curl -sS -o /tmp/hook.json -w '%{http_code}' -X POST "$VERCEL_DEPLOY_HOOK_URL")
            echo "Deploy Hook http=$code $(cat /tmp/hook.json 2>/dev/null)"
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
          }

          if ! trigger; then
            echo "::error::Deploy Hook 호출 실패 — 편성 데이터가 사이트에 반영되지 않습니다."
            echo "retried=false" >> $GITHUB_OUTPUT
            echo "final=HOOK_FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
          sleep 10

          set +e
          FIRST=$(poll 8)
          rc=$?
          set -e
          echo "1차 결과: $FIRST (rc=$rc)"

          if [ $rc -eq 0 ]; then
            echo "retried=false" >> $GITHUB_OUTPUT
            echo "final=READY" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "$FIRST" in
            TIMEOUT_NO_NEW|TIMEOUT_NOT_FOUND|TIMEOUT_API_ERR|TIMEOUT_NONE)
              # 훅은 201 을 줬는데 배포가 안 생겼다 → 계정 차단부터 가른다.
              ERR=$(site_error)
              echo "사이트 x-vercel-error: ${ERR:-(없음)}"
              if [ "$ERR" = "DEPLOYMENT_DISABLED" ]; then
                echo "::error::Vercel 계정이 차단돼 배포가 생성되지 않습니다(402). 사용량·결제 확인 필요."
                echo "retried=false" >> $GITHUB_OUTPUT
                echo "final=ACCOUNT_BLOCKED" >> $GITHUB_OUTPUT
                exit 1
              fi
              ;;
            TIMEOUT_*)
              # BUILDING/QUEUED 인 채로 창이 끝났다 = 느린 것뿐. 실패로 보고하지 않는다.
              echo "빌드가 아직 진행 중(${FIRST#TIMEOUT_}) — 실패 아님."
              echo "retried=false" >> $GITHUB_OUTPUT
              echo "final=BUILDING" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          echo "1차 결과 $FIRST → Deploy Hook 재호출."
          BASE_ID=$(latest | cut -d' ' -f1)
          trigger || true
          sleep 20

          set +e
          SECOND=$(poll 10)
          rc=$?
          set -e
          echo "2차 결과: $SECOND (rc=$rc)"
          echo "retried=true" >> $GITHUB_OUTPUT

          if [ $rc -eq 0 ]; then
            echo "final=READY" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "$SECOND" in
            TIMEOUT_NO_NEW|TIMEOUT_NOT_FOUND|TIMEOUT_API_ERR|TIMEOUT_NONE)
              ERR=$(site_error)
              if [ "$ERR" = "DEPLOYMENT_DISABLED" ]; then
                echo "final=ACCOUNT_BLOCKED" >> $GITHUB_OUTPUT
                exit 1
              fi
              ;;
            TIMEOUT_*)
              echo "재시도 빌드가 아직 진행 중(${SECOND#TIMEOUT_}) — 실패 아님."
              echo "final=BUILDING" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          echo "final=$SECOND" >> $GITHUB_OUTPUT
          exit 1

      - name: IndexNow 핵심 페이지 ping
        # Vercel READY 확인 직후에만 호출. 빌드 전이면 새 URL이 아직 404일 수 있어
        # ping 의미 없음. 실패해도 본 워크플로우는 통과(continue-on-error)시킴.
        if: steps.commit.outputs.updated == 'true' && steps.vercel.outputs.final == 'READY'
        continue-on-error: true
        run: npm run seo:indexnow

      # 가드가 걸리면 알린다. 크롤러가 팀명·리그를 잘못 파싱해 들여온 것이므로,
      # 놔두면 매치 페이지 제목·스코어 매칭·팀 페이지 목록이 조용히 어긋난다.
      # (색인 자체는 schedule-quality 게이트가 자동으로 막아준다 — 알림은 고치라는 신호)
      - name: Telegram 알림 (데이터 위생 가드 실패)
        if: always() && steps.dataguard.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="⚠️ 한해설 데이터 위생 가드 실패 — 크롤러가 팀명/리그를 잘못 파싱한 행을 들여왔습니다.%0A색인은 자동 차단되지만 표시는 어긋납니다.%0A로컬에서 확인: npm run test:team-name-hygiene && npm run test:schedule-quality%0A로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # 🔴 성공 알림 3종(1차 빌드 성공 · 재시도 후 성공 · 빌드 진행 중)을 제거했다 (2026-09-02).
      #
      # 편성 크롤은 하루 3회(08:18 + 백업 10:48·13:48) 돌고, 갱신이 있으면 그때마다
      # "✅ 편성표가 업데이트되었습니다" 가 갔다. 조치할 게 하나도 없는 문장이라
      # 알림을 읽지 않는 습관만 만든다. 진짜 신호(배포 실패·계정 차단·쿠팡 토큰
      # 만료·데이터 위생 가드)는 아래에 그대로 남아 있다.
      #
      # 정상이 조용해졌으므로 "알림이 없다 = 성공" 이 성립한다. 사이트가 실제로
      # 죽으면 uptime.yml 이 30분 안에 잡는다. BUILDING(폴링 창 안에 안 끝남)도
      # 실패가 아니라 몇 분 뒤 스스로 READY 가 되는 상태라 알리지 않는다.

      - name: Telegram 알림 (Vercel 배포 실패)
        # 🔴 BUILDING 은 제외한다 — 폴링 창 안에 안 끝났을 뿐 대개 몇 분 뒤 스스로 READY 가 된다.
        # 여기 오는 건 진짜 실패뿐이다.
        if: always() && steps.commit.outputs.updated == 'true' && steps.vercel.outputs.final != 'READY' && steps.vercel.outputs.final != 'BUILDING' && steps.vercel.outputs.final != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINAL: ${{ steps.vercel.outputs.final }}
          RETRIED: ${{ steps.vercel.outputs.retried }}
        run: |
          # 🔴 계정 차단은 빌드 실패가 아니다. Redeploy 를 눌러도 똑같이 막히므로
          #    안내 문구가 달라야 한다(2026-08-17 실제로 이 상태를 "빌드 실패,
          #    Redeploy 필요"로 잘못 알렸고, 8시간 동안 사이트 전체가 402 였다).
          if [ "$FINAL" = "ACCOUNT_BLOCKED" ]; then
            MSG=$(printf '%s\n' \
              "🚨 Vercel 계정이 차단됐습니다 (402 DEPLOYMENT_DISABLED)" \
              "" \
              "사이트 전체가 내려가 있고 새 배포가 아예 생성되지 않습니다." \
              "haeseol.com · chaeun · fadeby 모두 같은 계정이라 함께 멈춥니다." \
              "" \
              "Redeploy 로는 풀리지 않습니다. 대시보드에서 확인할 것:" \
              "1) Usage — 무료 한도 초과 여부" \
              "2) Settings > Billing — 결제 수단·미납" \
              "https://vercel.com/yghwanees-projects/~/usage")
          else
            MSG=$(printf '%s\n' \
              "🚨 Vercel 빌드 실패" \
              "" \
              "데이터는 GitHub에 push되었으나 사이트에 반영되지 못했습니다." \
              "최종 상태: ${FINAL}" \
              "재시도 여부: ${RETRIED}" \
              "" \
              "Vercel 대시보드에서 수동 Redeploy 필요" \
              "https://vercel.com/yghwanees-projects/hanhaeseol/deployments")
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: Telegram 알림 (쿠팡플레이 토큰 만료)
        if: steps.crawl.outputs.coupang_failed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '%s\n' \
            "🚨 쿠팡플레이 토큰 만료" \
            "" \
            "기존 데이터로 유지 중이지만, 새 경기 정보를 가져오지 못합니다." \
            "" \
            "토큰 갱신 방법" \
            "1. coupangplay.com 로그인" \
            "2. F12 → Application → Cookies" \
            "" \
            "COUPANG_P_AT → P_AT 쿠키 값" \
            "COUPANG_CT_LSID → CT_LSID 쿠키 값" \
            "COUPANG_TOKEN → token 쿠키 값" \
            "COUPANG_DEVICE_ID → device_id 쿠키 값" \
            "COUPANG_MEMBER_SRL → member_srl 쿠키 값" \
            "" \
            "GitHub Secrets 업데이트 (필수)" \
            "https://github.com/yghwanee/hanhaeseol/settings/secrets/actions" \
            "" \
            "업데이트 후 Actions에서 Run workflow로 수동 실행해주세요.")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
