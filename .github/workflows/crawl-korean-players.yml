name: Crawl Korean Players

on:
  schedule:
    # KST 04:37 (= UTC 19:37 전날). 아침 소셜 게시(KST 05:53)보다 먼저 돌아야
    # 그날 콘텐츠가 최신 로스터를 쓴다. 정각 러시 회피로 37분 오프셋.
    - cron: '37 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm ci

      - name: Crawl korean players
        run: npm run crawl:korean-players

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/korean-players.json
          if git diff --staged --quiet; then
            echo "No roster changes"
          else
            git commit -m "chore: update korean players roster"
            pushed=false
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=true; break; fi
              echo "push 충돌, 재시도 $i/5..."; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::5회 재시도에도 push 실패 — 코리안리거 로스터가 반영되지 않았습니다."
              exit 1
            fi
          fi

      - name: Telegram on failure
        if: failure()
        run: |
          # 🔴 로스터가 열흘 넘게 안 갱신되면 소비측이 로스터를 통째로 비운다
          # (선수 이름을 아예 안 쓴다). 조용히 죽는 걸 막으려고 실패는 반드시 알린다.
          resp=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=❌ 코리안리거 로스터 크롤 실패 — 열흘 넘게 실패하면 콘텐츠에서 선수 이름이 사라집니다. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          case "$resp" in *'"ok":true'*) ;; *) echo "::error::telegram 전송 실패: $resp"; exit 1;; esac
