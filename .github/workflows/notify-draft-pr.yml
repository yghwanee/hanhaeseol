name: Notify Draft PR

# 가이드 자동 초안 PR(draft/* 브랜치)이 열리면 텔레그램으로 검수 알림을 보낸다.
# 클라우드 스케줄러(한해설 Topic 아침 초안)는 텔레그램 토큰에 직접 접근 못 하므로,
# 토큰을 가진 GitHub Actions가 "다리" 역할로 PR 알림을 대신 쏜다.
on:
  pull_request:
    types: [opened, reopened]

jobs:
  notify:
    # 자동 초안은 draft/ 브랜치로만 올라오므로 그 PR만 알린다.
    if: startsWith(github.head_ref, 'draft/')
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          MSG=$(printf '%s\n' \
            "📝 새 가이드 초안 PR이 올라왔어요" \
            "" \
            "${PR_TITLE}" \
            "" \
            "검수 후 머지하면 발행됩니다:" \
            "${PR_URL}")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
